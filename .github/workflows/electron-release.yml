name: Electron Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install desktop dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Prepare bundled Python runtime
        shell: pwsh
        run: |
          python -m venv .python312
          .\.python312\Scripts\python.exe -m pip install --upgrade pip
          .\.python312\Scripts\python.exe -m pip install -r server\requirements.txt shapely==2.0.6 watchfiles==0.24.0

      - name: Build installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run electron:dist

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-electron/TianShu-AICC-Setup-*.exe
            dist-electron/TianShu-AICC-Setup-*.exe.blockmap
            dist-electron/latest.yml
          fail_on_unmatched_files: true
