name: Electron Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install pinned npm
        run: npm i -g npm@10.9.2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install desktop dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Prepare bundled Python runtime
        shell: pwsh
        run: |
          python -m venv .python312
          .\.python312\Scripts\python.exe -m pip install --upgrade pip
          .\.python312\Scripts\python.exe -m pip install -r server\requirements.txt shapely==2.0.6 watchfiles==0.24.0

      - name: Build client
        run: npm run build:client

      - name: Check Electron resources
        run: npm run electron:check

      - name: Build unpacked app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          DEBUG: electron-builder
        run: npx electron-builder --win --dir --publish never

      - name: Build NSIS installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          DEBUG: electron-builder
        run: |
          New-Item -ItemType Directory -Force dist-electron | Out-Null
          & npx.cmd electron-builder --win nsis --publish never 2>&1 | Tee-Object -FilePath dist-electron\electron-builder-nsis.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            if (Test-Path dist-electron\electron-builder-nsis.log) {
              Write-Host "NSIS electron-builder log tail:"
              Get-Content dist-electron\electron-builder-nsis.log -Tail 120
            }
            exit $exitCode
          }

      - name: Report Electron diagnostics
        if: failure()
        shell: pwsh
        run: |
          $logPath = "dist-electron\electron-builder-nsis.log"
          if (Test-Path $logPath) {
            $tail = (Get-Content $logPath -Tail 40) -join "`n"
            $escaped = $tail.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Host "::error title=NSIS electron-builder log tail::$escaped"
          } else {
            Write-Host "::error title=NSIS electron-builder log missing::No NSIS diagnostic log was produced."
          }

      - name: Upload Electron diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-release-diagnostics
          path: |
            dist-electron/electron-builder-nsis.log
            dist-electron/builder-debug.yml
            dist-electron/latest.yml
            dist-electron/*.blockmap
          if-no-files-found: ignore

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-electron/TianShu-Setup-*.exe
            dist-electron/TianShu-Setup-*.exe.blockmap
            dist-electron/latest.yml
          fail_on_unmatched_files: true
