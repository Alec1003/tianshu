name: tianshu

services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-tianshu}"
      POSTGRES_USER: "${POSTGRES_USER:-tianshu}"
      # Development default only; override in shared deployments.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-tianshu-dev-password}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      TIANSHU_ENV: "${TIANSHU_ENV:-development}"
      # JWT secret should be overridden in real deployments.
      TIANSHU_JWT_SECRET: "${TIANSHU_JWT_SECRET:-tianshu-dev-secret-change-me-in-production}"
      TIANSHU_FIRST_USER_IS_SUPERUSER: "${TIANSHU_FIRST_USER_IS_SUPERUSER:-true}"
      TIANSHU_DATABASE_URL: "${TIANSHU_DATABASE_URL:-postgresql+asyncpg://tianshu:tianshu-dev-password@postgres:5432/tianshu}"
      TIANSHU_DATABASE_POOL_SIZE: "${TIANSHU_DATABASE_POOL_SIZE:-5}"
      TIANSHU_DATABASE_MAX_OVERFLOW: "${TIANSHU_DATABASE_MAX_OVERFLOW:-10}"
      TIANSHU_DATABASE_POOL_TIMEOUT_SECONDS: "${TIANSHU_DATABASE_POOL_TIMEOUT_SECONDS:-30}"
      TIANSHU_DATABASE_POOL_RECYCLE_SECONDS: "${TIANSHU_DATABASE_POOL_RECYCLE_SECONDS:-1800}"
      TIANSHU_RESOURCE_DIR: "${TIANSHU_RESOURCE_DIR:-/app}"
      TIANSHU_USER_DATA_DIR: "${TIANSHU_USER_DATA_DIR:-/app/server/data}"
      TIANSHU_SKILLS_DIR: "${TIANSHU_SKILLS_DIR:-./data/skills}"
      TIANSHU_CORS_ORIGINS: "${TIANSHU_CORS_ORIGINS:-http://localhost:3002,http://127.0.0.1:3002}"
      TIANSHU_LLM_MODEL: "${TIANSHU_LLM_MODEL:-}"
      TIANSHU_LLM_API_KEY: "${TIANSHU_LLM_API_KEY:-}"
      TIANSHU_LLM_BASE_URL: "${TIANSHU_LLM_BASE_URL:-}"
      TIANSHU_ALLOW_PRIVATE_MODEL_BASE_URLS: "${TIANSHU_ALLOW_PRIVATE_MODEL_BASE_URLS:-false}"
      TIANSHU_EXTERNAL_MCP_SERVERS: "${TIANSHU_EXTERNAL_MCP_SERVERS:-}"
    volumes:
      - server_data:/app/server/data
      - npm_cache:/root/.npm
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_ENV: standalone
        VITE_API_SERVER_URL: ""
        VITE_AI_SERVER_URL: ""
    ports:
      - "3002:3002"
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy

volumes:
  # Named volumes keep data across image rebuilds; use `down -v` to wipe.
  server_data: {}
  postgres_data: {}
  npm_cache: {}
