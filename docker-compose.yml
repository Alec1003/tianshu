services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-aicc}"
      POSTGRES_USER: "${POSTGRES_USER:-aicc}"
      # Development default only; override in shared deployments.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-aicc-dev-password}"
    volumes:
      - aicc_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      AICC_ENV: "${AICC_ENV:-development}"
      # JWT secret should be overridden in real deployments.
      AICC_JWT_SECRET: "${AICC_JWT_SECRET:-aicc-dev-secret-change-me-in-production}"
      AICC_FIRST_USER_IS_SUPERUSER: "${AICC_FIRST_USER_IS_SUPERUSER:-true}"
      AICC_DATABASE_URL: "${AICC_DATABASE_URL:-postgresql+asyncpg://aicc:aicc-dev-password@postgres:5432/aicc}"
      AICC_DATABASE_POOL_SIZE: "${AICC_DATABASE_POOL_SIZE:-5}"
      AICC_DATABASE_MAX_OVERFLOW: "${AICC_DATABASE_MAX_OVERFLOW:-10}"
      AICC_DATABASE_POOL_TIMEOUT_SECONDS: "${AICC_DATABASE_POOL_TIMEOUT_SECONDS:-30}"
      AICC_DATABASE_POOL_RECYCLE_SECONDS: "${AICC_DATABASE_POOL_RECYCLE_SECONDS:-1800}"
      AICC_CORS_ORIGINS: "${AICC_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
      AICC_LLM_MODEL: "${AICC_LLM_MODEL:-}"
      AICC_LLM_API_KEY: "${AICC_LLM_API_KEY:-}"
      AICC_LLM_BASE_URL: "${AICC_LLM_BASE_URL:-}"
    volumes:
      - aicc_server_data:/app/server/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_ENV: standalone
        VITE_API_SERVER_URL: ""
        VITE_AI_SERVER_URL: ""
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy

volumes:
  # Named volumes keep data across image rebuilds; use `down -v` to wipe.
  aicc_server_data: {}
  aicc_postgres_data: {}
