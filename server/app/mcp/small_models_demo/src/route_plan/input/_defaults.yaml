# 路径规划默认配置 — 场景文件中未指定的字段将使用此处的默认值

# ---------------------------------------------------------------------------
# 规划参数
# ---------------------------------------------------------------------------
scenario:
  planning:
    # --- 网格 ---
    # 网格分辨率 (km)
    grid_resolution_km: 10.0
    # 高度层 (m) — 路径将在这些高度层上搜索
    altitude_levels: [3000, 5000, 8000, 10000]
    # 网格边距 (km) — 在所有平台/目标/威胁外围额外扩展的范围
    margin_km: 50.0

    # --- 代价权重 ---
    # 距离代价权重
    distance_weight: 1.0
    # 威胁暴露代价权重
    threat_weight: 100.0
    # 方向偏差代价权重 (偏离指定进入方向的惩罚)
    direction_weight: 80.0
    # 转弯代价权重
    turn_weight: 0.0

    # --- 搜索 ---
    # 是否启用 heading 状态 (关闭后为传统 3D 网格 A*)
    use_heading: true
    # 启发函数类型: "fmm" (Fast Marching Method) 或 "ecef" (直线距离)
    heuristic: "dubins"
    # 是否启用双向 A* 搜索
    bidirectional: true
    # 路径边采样点数 (用于威胁积分精度)
    edge_samples: 0

    # --- 隐身 ---
    # 隐身因子 (0~1) — 乘以威胁值，越小越隐身
    stealth_factor: 0.1

    # --- 转弯 ---
    # 飞行器最小转弯半径 (km) — 0 表示无约束
    aircraft_turn_radius_km: 0
    # 导弹最小转弯半径 (km) — 0 表示无约束
    missile_turn_radius_km: 6.0

    # --- 攻击点候选 ---
    # 默认攻击点距目标距离 (km)
    default_attack_point_radius_km: 50.0
    # 默认攻击点高于目标的高度 (m)
    default_attack_point_up_height_m: 3000.0
    # 默认攻击点候选数量
    default_attack_point_count: 4

    # --- 进入参考点候选 ---
    # 默认进入参考点距目标距离 (km)
    default_approach_ref_radius_km: 50.0
    # 默认进入参考点高于目标的高度 (m)
    default_approach_ref_up_height_m: 0.0
    # 默认进入参考点候选数量
    default_approach_ref_count: 4

    # --- 方向 ---
    # 默认攻击模式 (1=直攻, 2=多角度, 3=发射区, 4=隐身突防)
    default_mode: 2
    # 方向采样数 (进入方向的分辨率)
    heading_count: 12

    # --- 约束与容差 ---
    # 垂直开放距离 (km) — 高度差超过此值的威胁视为"开放"
    vertical_open_threat_distance_km: 50.0

    # --- 选择容差 ---
    # 威胁容差比例 — 允许威胁值比最低威胁高此比例的路径
    threat_tolerance_ratio: 0.05

# ---------------------------------------------------------------------------
# 平台默认值 (场景中每个平台的缺省字段)
# ---------------------------------------------------------------------------
# platform_defaults:
#   class: aircraft              # aircraft | missile
#   speed: 250                   # 速度 (m/s)
