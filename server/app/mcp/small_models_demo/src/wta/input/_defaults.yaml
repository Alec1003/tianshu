# WTA 默认配置 — 场景文件中未指定的字段将使用此处的默认值
# 场景文件中的同名字段会覆盖此处的值

# ---------------------------------------------------------------------------
# 求解器参数
# ---------------------------------------------------------------------------
solver:
  # 命中概率 — 1.0 表示确定性命中，<1.0 启用随机命中模型
  hit_probability: 1.0

  # 联合置信度 — MILP 使用此置信度确保所有目标联合达标 (0~1)
  confidence_level: 0.95

  # 风险置信度 — CEP 风险约束的置信水平 (0~1)
  risk_confidence: 0.5

  # 攻击波次数
  waves: 1

  # 防空系统损失后的剩余损伤因子 — null 表示不使用全局覆盖
  # 如果设置，所有目标的 loss_air_defense_damage 将统一使用此值
  loss_air_defense_damage: 0.8
